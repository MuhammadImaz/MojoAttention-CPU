name: Foundation Quality

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-quality:
    name: foundation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_PAGER: cat
      LC_ALL: C
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_INDEX: https://modular.gateway.scarf.sh/simple/ https://download.pytorch.org/whl/cpu
    steps:
      - name: Resolve immutable event identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            trusted_base="${PR_BASE}"
            candidate_head="${PR_HEAD}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            trusted_base="${PUSH_BASE}"
            candidate_head="${PUSH_HEAD}"
          else
            echo 'contract-invalid: unsupported workflow event' >&2
            exit 3
          fi
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "${trusted_base}" =~ ${sha_pattern} || ! "${candidate_head}" =~ ${sha_pattern} ]]; then
            echo 'contract-invalid: event identity is not commit-bound' >&2
            exit 3
          fi
          if [[ "${trusted_base}" == '0000000000000000000000000000000000000000' ]]; then
            echo 'contract-invalid: trusted base is unavailable' >&2
            exit 3
          fi
          printf 'trusted_base=%s\ncandidate_head=%s\n' "${trusted_base}" "${candidate_head}" >>"${GITHUB_OUTPUT}"

      - name: Check out authenticated trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.identity.outputs.trusted_base }}
          path: .trusted/base
          persist-credentials: false
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.14.4
          architecture: x64

      - name: Verify Python
        run: python --version | grep -Fx 'Python 3.14.4'

      - name: Acquire trusted validator and controls
        env:
          TRUSTED_BASE: ${{ steps.identity.outputs.trusted_base }}
          CANDIDATE_HEAD: ${{ steps.identity.outputs.candidate_head }}
        run: |
          set -euo pipefail
          trusted_root="${GITHUB_WORKSPACE}/.trusted/base"
          control_root="${RUNNER_TEMP}/foundation-trusted-controls"
          mkdir -p "${control_root}/contracts" "${control_root}/schemas" "${control_root}/validator"
          test "$(git -C "${trusted_root}" rev-parse "${TRUSTED_BASE}^{commit}")" = "${TRUSTED_BASE}"
          git -C "${trusted_root}" fetch --no-tags --force origin "${CANDIDATE_HEAD}"
          test "$(git -C "${trusted_root}" rev-parse "${CANDIDATE_HEAD}^{commit}")" = "${CANDIDATE_HEAD}"
          git -C "${trusted_root}" show "${TRUSTED_BASE}:contracts/protected-assets.json" >"${control_root}/contracts/protected-assets.json"
          git -C "${trusted_root}" show "${TRUSTED_BASE}:schemas/protected-assets.schema.json" >"${control_root}/schemas/protected-assets.schema.json"
          git -C "${trusted_root}" show "${TRUSTED_BASE}:schemas/protected-change-authorization.schema.json" >"${control_root}/schemas/protected-change-authorization.schema.json"
          git -C "${trusted_root}" show "${TRUSTED_BASE}:src/mojoattention/validation/protected_assets.py" >"${control_root}/validator/protected_assets.py"
          git -C "${trusted_root}" show "${TRUSTED_BASE}:src/mojoattention/validation/paths.py" >"${control_root}/validator/paths.py"
          if git -C "${trusted_root}" cat-file -e "${TRUSTED_BASE}:scripts/trusted_ci_gate.py" 2>/dev/null; then
            git -C "${trusted_root}" show "${TRUSTED_BASE}:scripts/trusted_ci_gate.py" >"${control_root}/trusted_ci_gate.py"
            git -C "${trusted_root}" show "${TRUSTED_BASE}:contracts/required-checks.json" >"${control_root}/contracts/required-checks.json"
            git -C "${trusted_root}" show "${TRUSTED_BASE}:schemas/required-checks.schema.json" >"${control_root}/schemas/required-checks.schema.json"
            printf 'trusted-base\n' >"${control_root}/registry-source"
          else
            git -C "${trusted_root}" show "${CANDIDATE_HEAD}:scripts/trusted_ci_gate.py" >"${control_root}/trusted_ci_gate.py"
            git -C "${trusted_root}" show "${CANDIDATE_HEAD}:contracts/required-checks.json" >"${control_root}/contracts/required-checks.json"
            git -C "${trusted_root}" show "${CANDIDATE_HEAD}:schemas/required-checks.schema.json" >"${control_root}/schemas/required-checks.schema.json"
            printf 'story-1-8-bootstrap\n' >"${control_root}/registry-source"
          fi
          chmod -R a-w "${control_root}"

      - name: Validate trusted policy and candidate authorization
        env:
          TRUSTED_BASE: ${{ steps.identity.outputs.trusted_base }}
          CANDIDATE_HEAD: ${{ steps.identity.outputs.candidate_head }}
          EVENT_NAME: ${{ github.event_name }}
          EXTERNAL_AUTHORIZATION: ${{ vars.PROTECTED_CHANGE_AUTHORIZATION }}
        run: python -I -S "${RUNNER_TEMP}/foundation-trusted-controls/trusted_ci_gate.py" "${GITHUB_WORKSPACE}/.trusted/base" "${RUNNER_TEMP}/foundation-trusted-controls"

      - name: Validate calibrated runner capacity
        run: |
          set -euo pipefail
          python -I -S - "${RUNNER_TEMP}/foundation-trusted-controls/contracts/required-checks.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          registry = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          active = [tier for tier in registry["tiers"] if tier["activation"] == "active"]
          if len(active) != 1:
              raise SystemExit("contract-invalid: active required-check inventory is ambiguous")
          required = active[0]["runner"]
          lines = pathlib.Path("/proc/meminfo").read_text().splitlines()
          memory_kib = int(next(line.split()[1] for line in lines if line.startswith("MemTotal:")))
          memory_gib = memory_kib / 1024 / 1024
          cpus = os.cpu_count() or 0
          if memory_gib < required["minimum_memory_gib"] or cpus < required["minimum_logical_cpus"]:
              raise SystemExit("infrastructure-invalid: runner capacity is below protected registry prerequisites")
          PY

      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.identity.outputs.candidate_head }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-pinned uv
        working-directory: candidate
        run: scripts/install-uv.sh

      - name: Synchronize exact candidate lock
        working-directory: candidate
        run: .tools/uv/uv --config-file uv.toml --project "$GITHUB_WORKSPACE/candidate" sync --locked --all-groups

      - name: Run Foundation Quality
        working-directory: candidate
        run: scripts/quality.sh --ci

      - name: Evaluate authenticated hosted governance
        working-directory: candidate
        env:
          GOVERNANCE_OBSERVATION: ${{ vars.GOVERNANCE_OBSERVATION }}
          TRUSTED_BASE: ${{ steps.identity.outputs.trusted_base }}
          CANDIDATE_HEAD: ${{ steps.identity.outputs.candidate_head }}
        run: |
          set -euo pipefail
          test -n "${GOVERNANCE_OBSERVATION}" || { echo 'infrastructure-invalid: authenticated governance observation is unavailable' >&2; exit 2; }
          observation_path="${RUNNER_TEMP}/governance-observation.json"
          governance_path="${RUNNER_TEMP}/governance-result.json"
          python -I -S -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).write_text(sys.argv[2], encoding="utf-8")' "${observation_path}" "${GOVERNANCE_OBSERVATION}"
          observed_at="$(python -I -S -c 'import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["observed_at"])' "${observation_path}")"
          scripts/run.sh mojoattention governance audit \
            --intent contracts/repository-governance.json \
            --intent-schema schemas/repository-governance.schema.json \
            --observation "${observation_path}" \
            --observation-schema schemas/governance-observation.schema.json \
            --required-checks contracts/required-checks.json \
            --required-checks-schema schemas/required-checks.schema.json \
            --repository MuhammadImaz/MojoAttention-CPU \
            --default-branch main \
            --head-sha "${CANDIDATE_HEAD}" \
            --base-sha "${TRUSTED_BASE}" \
            --evaluation-time "${observed_at}" \
            --maximum-age-seconds 3600 \
            --api-version 2026-03-10 >"${governance_path}"

      - name: Produce and independently verify canonical evidence
        id: evidence
        working-directory: candidate
        env:
          EXTERNAL_AUTHORIZATION: ${{ vars.PROTECTED_CHANGE_AUTHORIZATION }}
          TRUSTED_BASE: ${{ steps.identity.outputs.trusted_base }}
          CANDIDATE_HEAD: ${{ steps.identity.outputs.candidate_head }}
        run: |
          set -euo pipefail
          authorization_args=()
          if [[ -n "${EXTERNAL_AUTHORIZATION}" ]]; then
            authorization_path="${RUNNER_TEMP}/protected-change-authorization.json"
            python -I -S -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).write_text(sys.argv[2], encoding="utf-8")' "${authorization_path}" "${EXTERNAL_AUTHORIZATION}"
            authorization_args=(--authorization "${authorization_path}")
          fi
          scripts/run.sh python -m mojoattention.validation.ci_evidence \
            --root "${GITHUB_WORKSPACE}/candidate" \
            --output "${RUNNER_TEMP}/foundation-runs" \
            --trusted-base "${TRUSTED_BASE}" \
            --candidate-head "${CANDIDATE_HEAD}" \
            --trusted-policy "${RUNNER_TEMP}/foundation-trusted-controls/contracts/protected-assets.json" \
            --trusted-policy-schema "${RUNNER_TEMP}/foundation-trusted-controls/schemas/protected-assets.schema.json" \
            --authorization-schema "${RUNNER_TEMP}/foundation-trusted-controls/schemas/protected-change-authorization.schema.json" \
            "${authorization_args[@]}" \
            --governance-result "${RUNNER_TEMP}/governance-result.json" \
            --github-run-id "${{ github.run_id }}" \
            --github-run-attempt "${{ github.run_attempt }}" \
            --workflow-revision "${CANDIDATE_HEAD}" \
            --job-name foundation-quality \
            --check-name foundation-quality \
            --github-output "${GITHUB_OUTPUT}"
          printf 'Evidence digest: `%s`\n' "$(sed -n 's/^evidence_digest=//p' "${GITHUB_OUTPUT}")" >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload verified complete evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ steps.evidence.outputs.complete_root }}/*.complete
          retention-days: ${{ steps.evidence.outputs.retention_days }}
          if-no-files-found: error
          overwrite: false
