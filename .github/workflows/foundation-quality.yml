name: Foundation Quality

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-quality:
    name: foundation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          architecture: x64
      - name: Verify Python
        run: python --version | grep -Fx 'Python 3.14.4'
      - name: Install checksum-pinned uv
        run: scripts/install-uv.sh
      - name: Synchronize exact lock for runner-independent quality
        run: .tools/uv/uv --config-file uv.toml --project "$GITHUB_WORKSPACE" sync --locked --all-groups
      - name: Run Foundation Quality
        run: scripts/quality.sh --ci
